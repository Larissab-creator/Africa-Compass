name: Publish Africa Compass Mahé road map

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - "src/mahe_roads.py"
      - "src/mahe_bus_routes.py"
      - "src/build_map_site.py"
      - "docs/map/**"
      - "requirements.txt"
      - ".github/workflows/refresh-mahe-roads.yml"

concurrency:
  group: mahe-road-map-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Mahé road geometry and build map data
        run: python src/mahe_roads.py

      - name: Download Mahé bus routes and mapped stops
        run: python src/mahe_bus_routes.py

      - name: Assemble interactive map website
        run: python src/build_map_site.py

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Package map and data files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: africa-compass-mahe-roads-${{ github.run_number }}
          path: |
            data/raw/mahe_roads_overpass.json
            data/processed/mahe_roads.csv
            data/processed/mahe_roads.geojson
            data/processed/mahe_road_changes.csv
            data/raw/mahe_bus_routes_overpass.json
            data/processed/mahe_bus_routes.geojson
            data/processed/mahe_bus_stops.geojson
            data/processed/mahe_bus_routes.csv
            data/processed/mahe_bus_stops.csv
            data/history/mahe_roads_snapshot.json
            outputs/mahe_road_network.html
            _site/
          if-no-files-found: error
          retention-days: 30

      - name: Save Mahé road snapshot for the next comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/mahe_roads_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mahé road network snapshot [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Mahé road snapshot has no changes."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
