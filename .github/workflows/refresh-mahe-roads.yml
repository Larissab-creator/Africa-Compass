name: Refresh Mahé road map

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - "src/mahe_roads.py"
      - "requirements.txt"
      - ".github/workflows/refresh-mahe-roads.yml"

permissions:
  contents: write

jobs:
  build-road-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Mahé road geometry and build map
        run: python src/mahe_roads.py

      - name: Package road map and inventory
        uses: actions/upload-artifact@v4
        with:
          name: africa-compass-mahe-roads-${{ github.run_number }}
          path: |
            data/raw/mahe_roads_overpass.json
            data/processed/mahe_roads.csv
            data/processed/mahe_roads.geojson
            data/processed/mahe_road_changes.csv
            data/history/mahe_roads_snapshot.json
            outputs/mahe_road_network.html
          if-no-files-found: error
          retention-days: 30

      - name: Save Mahé road snapshot for the next comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/mahe_roads_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mahé road network snapshot [skip ci]"
            git push
          else
            echo "Mahé road snapshot has no changes."
          fi
